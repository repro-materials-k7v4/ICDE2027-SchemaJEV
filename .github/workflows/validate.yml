name: Validate reproducibility artifact

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m schemajev.evaluation_inputs
      - run: python figures/new_experiments/validate_results.py
      - run: python figures/code/build.py
        env:
          MPLBACKEND: Agg
